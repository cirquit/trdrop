[project]
name = "trdrop"
version = "2.0.0-dev"
description = "Video framerate and frametime analysis tool"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexander Erben" }]
dependencies = [
    "av>=14.0.0",
    "numba>=0.63.1",
    "numpy>=1.26.0",
    "PyQt6>=6.6.0",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "flake8>=7.0.0", "isort>=5.13.0", "basedpyright>=1.18.0"]

[project.scripts]
trdrop = "trdrop.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trdrop"]

[tool.isort]
profile = "black"
line_length = 100

[tool.basedpyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: marks tests as GUI/interactive engine tests (deselect with '-m \"not gui\"')",
]

[dependency-groups]
dev = [
    "pyinstaller>=6.19.0",
]
